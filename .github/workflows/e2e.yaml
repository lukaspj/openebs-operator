name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: docker/setup-buildx-action@v3

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: openebs-e2e
          wait: 120s

      - name: Build and load operator image
        run: |
          docker build -t openebs-operator:e2e -f Dockerfile .
          kind load docker-image openebs-operator:e2e --name openebs-e2e

      - name: Deploy operator
        run: |
          sed -i 's|ghcr.io/lukaspj/openebs-operator:latest|openebs-operator:e2e|g' deploy/operator.yaml
          kubectl apply -f deploy/operator.yaml
          kubectl wait --for=condition=Available deployment/openebs-operator-controller-manager -n openebs-operator-system --timeout=120s

      - name: Run e2e tests
        run: go test -v -tags=e2e -count=1 -timeout 10m ./e2e/...
