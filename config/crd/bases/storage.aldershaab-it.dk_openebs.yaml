---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openebs.storage.aldershaab-it.dk
spec:
  group: storage.aldershaab-it.dk
  names:
    kind: OpenEBS
    listKind: OpenEBSList
    plural: openebs
    singular: openebs
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                hostpath:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    basePath:
                      type: string
                      default: "/var/openebs/local"
                    isDefaultClass:
                      type: boolean
                    storageClassName:
                      type: string
                      default: "openebs-hostpath"
                  required:
                    - enabled
                lvm:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    storageClassName:
                      type: string
                      default: "openebs-lvm"
                    isDefaultClass:
                      type: boolean
                    volumeGroup:
                      type: string
                      default: "lvmvg"
                  required:
                    - enabled
                zfs:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    storageClassName:
                      type: string
                      default: "openebs-zfs"
                    poolName:
                      type: string
                      default: "zfspool"
                    isDefaultClass:
                      type: boolean
                  required:
                    - enabled
                rawfile:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    basePath:
                      type: string
                      default: "/var/openebs/rawfile"
                    isDefaultClass:
                      type: boolean
                  required:
                    - enabled
                mayastor:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    etcdReplicaCount:
                      type: integer
                      default: 3
                    ioEngineResources:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                        hugepages2Mi:
                          type: string
                    coreAgentResources:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                        hugepages2Mi:
                          type: string
                    storageClassName:
                      type: string
                      default: "mayastor"
                    isDefaultClass:
                      type: boolean
                    snapshotClassName:
                      type: string
                      default: "mayastor-snapshot"
                    etcdStorageSize:
                      type: string
                      default: "10Gi"
                    etcdStorageClassName:
                      type: string
                      default: ""
                  required:
                    - enabled
                imagePullSecrets:
                  type: array
                  items:
                    type: string
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                images:
                  type: object
                  properties:
                    lvm:
                      type: string
                    hostpath:
                      type: string
                    zfs:
                      type: string
                    rawfile:
                      type: string
                    csiProvisioner:
                      type: string
                    csiResizer:
                      type: string
                    csiSnapshotter:
                      type: string
                    csiNodeRegistrar:
                      type: string
                    csiAttacher:
                      type: string
                    csiSnapshotController:
                      type: string
                    mayastor:
                      type: string
                    etcd:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Installing
                    - Running
                    - Degraded
                    - Failed
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                engines:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        enum:
                          - hostpath
                          - lvm
                          - zfs
                          - rawfile
                          - mayastor
                      phase:
                        type: string
                      version:
                        type: string
                      message:
                        type: string
                    required:
                      - name
