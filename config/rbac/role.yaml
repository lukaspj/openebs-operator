---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openebs-operator-manager-role
rules:
  - apiGroups:
      - storage.aldershaab-it.dk
    resources:
      - openebs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - storage.aldershaab-it.dk
    resources:
      - openebs/finalizers
    verbs:
      - update
  - apiGroups:
      - storage.aldershaab-it.dk
    resources:
      - openebs/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - namespaces
      - serviceaccounts
      - pods
      - nodes
      - events
      - persistentvolumes
      - persistentvolumeclaims
      - configmaps
      - secrets
      - services
    verbs:
      - "*"
  - apiGroups:
      - apps
    resources:
      - deployments
      - daemonsets
      - statefulsets
    verbs:
      - "*"
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - clusterrolebindings
    verbs:
      - "*"
  - apiGroups:
      - storage.k8s.io
    resources:
      - csidrivers
      - storageclasses
      - csinodes
      - volumeattachments
      - csistoragecapacities
    verbs:
      - "*"
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - "*"
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshotclasses
    verbs:
      - "*"
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - "*"
  - apiGroups:
      - local.openebs.io
    resources:
      - lvmnodes
      - lvmsnapshots
      - lvmvolumes
      - lvmvolumes/status
    verbs:
      - "*"
  - apiGroups:
      - zfs.openebs.io
    resources:
      - zfsnodes
      - zfssnapshots
      - zfsvolumes
      - zfsvolumes/status
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openebs-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openebs-operator-manager-role
subjects:
  - kind: ServiceAccount
    name: openebs-operator-controller-manager
    namespace: openebs-operator-system
